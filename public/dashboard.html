<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Driftless — Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg2:#0A1A3D;
  --panel:#0C1B38;
  --grid:rgba(79,195,247,0.09);
  --line:#1F3A66;
  --ink:#EAF2FF;
  --dim:#7FA3D9;
  --accent:#4FC3F7;
  --accent2:#3B82F6;
  --danger:#FF6B6B;
  --gold:#FFD166;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background-color:#000000;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg, #000000 0%, var(--bg2) 100%);
  background-size:36px 36px, 36px 36px, 100% 100%;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.5;
}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 60px;}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);}
.logo{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:15px;letter-spacing:0.5px;}
.logo span{color:var(--accent);}
nav a{color:var(--dim);text-decoration:none;font-size:14px;margin-left:18px;}
h1{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1;margin:32px 0 8px;text-transform:uppercase;}
.sub{color:var(--dim);font-size:15px;margin:0 0 28px;}

.keyentry{border:1px dashed var(--line);padding:16px;margin-bottom:28px;}
.keyentry p{color:var(--dim);font-size:13px;margin:0 0 10px;}
.keyentry input{width:100%;background:#000;border:1px solid var(--line);color:var(--ink);padding:10px;font-family:'JetBrains Mono',monospace;font-size:13px;margin-bottom:10px;}
.keyentry button{background:var(--accent);color:#001018;border:none;font-family:'JetBrains Mono',monospace;font-weight:500;padding:10px 16px;cursor:pointer;font-size:13px;}
.keyentry .status{font-size:12px;color:var(--dim);margin-top:8px;display:block;}

.source-card{border:1px solid var(--line);background:var(--panel);padding:18px;margin-bottom:16px;}
.source-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.source-card .name{font-family:'Big Shoulders Display',sans-serif;font-size:20px;text-transform:uppercase;}
.source-card .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);}
.badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border:1px solid var(--gold);color:var(--gold);}
.field-list{margin-top:10px;}
.field-item{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(79,195,247,0.1);}
.field-item:last-child{border-bottom:none;}
.field-item .pill{font-size:10px;padding:1px 6px;border:1px solid var(--line);color:var(--dim);}
.field-item .pill.req{color:var(--danger);border-color:var(--danger);}
.forward-line{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);}
.forward-line span{color:var(--accent2);}
.empty{color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:13px;padding:20px 0;}
.breaking-section{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;}
.breaking-section h4{font-family:'JetBrains Mono',monospace;font-size:11px;color:#FF6B6B;text-transform:uppercase;margin:0 0 8px;}
.breaking-item{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);padding:4px 0;border-bottom:1px solid rgba(255,107,107,0.1);}
.breaking-item:last-child{border-bottom:none;}
.breaking-item .field{color:#FF6B6B;}
.breaking-none{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);}

</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="logo" style="display:flex;align-items:center;gap:8px;"><svg width="18" height="18" viewBox="0 0 32 32"><rect x="4" y="4" width="18" height="18" fill="none" stroke="#7FA3D9" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="10" y="10" width="18" height="18" fill="#4FC3F7"/></svg>DRIFT<span>LESS</span></div>
  <div><a href="/">home</a><a href="/test.html">console</a></div>
</nav>

<h1>Dashboard</h1>
<p class="sub">Enter your API key to see all your sources, live confidence scores, and forwarding setup in one place.</p>

<div class="keyentry">
  <p>Paste your API key (starts with dk_):</p>
  <input type="text" id="key-input" placeholder="dk_...">
  <button onclick="loadDashboard()">Load Dashboard</button>
  <span class="status" id="key-status"></span>
</div>

<div id="sources-list"></div>

</div>

<script>
function fetchWithTimeout(url, opts, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, Object.assign({}, opts, { signal: controller.signal }))
    .finally(() => clearTimeout(timer));
}

async function loadDashboard(){
  const key = document.getElementById('key-input').value.trim();
  const status = document.getElementById('key-status');
  const list = document.getElementById('sources-list');
  if(!key){
    status.textContent = 'Enter a key first.';
    return;
  }
  status.textContent = 'Loading...';
  list.innerHTML = '';
  try {
    const res = await fetchWithTimeout('/sources', { headers:{'x-api-key':key} }, 8000);
    if(res.status === 401){
      status.textContent = 'Invalid API key.';
      return;
    }
    const data = await res.json();
    status.textContent = '';
    if(!data.sources || data.sources.length === 0){
      list.innerHTML = '<div class="empty">No sources yet. Send an event to /webhook/:source with this key to see it appear here.</div>';
      return;
    }
    data.sources.forEach(src => {
      const card = document.createElement('div');
      card.className = 'source-card';

      let fieldsHtml = '';
      for(const name in src.fields){
        const f = src.fields[name];
        const conf = src.eventCount ? Math.round((f.seenCount||0)/src.eventCount*100) : 0;
        fieldsHtml += '<div class="field-item"><span>' + name + ' (' + f.type + ') — ' + conf + '% confidence</span><span class="pill ' + (f.required?'req':'') + '">' + (f.required?'required':'optional') + '</span></div>';
      }

      card.innerHTML =
        '<div class="head"><span class="name">' + src.name + '</span><span class="badge">v' + src.version + '</span></div>' +
        '<div class="meta">' + src.eventCount + ' events received</div>' +
        '<div class="field-list">' + fieldsHtml + '</div>' +
        '<div class="forward-line">Forward URL: <span>' + (src.forwardUrl || 'not configured') + '</span></div>' +
        '<div class="breaking-section" id="breaking-' + src.name + '"><h4>Breaking Changes</h4><span class="breaking-none">Loading...</span></div>';

      list.appendChild(card);
      loadBreakingChanges(key, src.name);
    });
  } catch(e){
    status.textContent = 'Failed to load: ' + e.message;
  }
}

async function loadBreakingChanges(key, sourceName){
  try {
    const res = await fetchWithTimeout('/breaking-changes/' + sourceName, { headers:{'x-api-key':key} }, 8000);
    const data = await res.json();
    const box = document.getElementById('breaking-' + sourceName);
      box.innerHTML = '<h4>Breaking Changes</h4><span class="breaking-none">None detected — this source has never sent unexpected data.</span>';
      return;
    }
    let html = '<h4>Breaking Changes</h4>';
    data.changes.slice().reverse().forEach(c => {
      const time = new Date(c.timestamp).toLocaleString();
      html += '<div class="breaking-item"><span class="field">' + c.field + '</span> expected ' + c.expectedType + ', got ' + c.actualType + ' — ' + time + '</div>';
    });
    box.innerHTML = html;
  } catch(e){
    const box = document.getElementById('breaking-' + sourceName);
    if(box) box.innerHTML = '<h4>Breaking Changes</h4><span class="breaking-none">Could not load.</span>';
  }
}

async function loadBreakingChanges(key, sourceName){
  try {
    const res = await fetchWithTimeout('/breaking-changes/' + sourceName, { headers:{'x-api-key':key} }, 8000);
    const data = await res.json();
    const box = document.getElementById('breaking-' + sourceName);
    if(!data.changes || data.changes.length === 0){
      box.innerHTML = '<h4>Breaking Changes</h4><span class="breaking-none">None detected — this source has never sent unexpected data.</span>';
      return;
    }
    let html = '<h4>Breaking Changes</h4>';
    data.changes.slice().reverse().forEach(c => {
      const time = new Date(c.timestamp).toLocaleString();
      html += '<div class="breaking-item"><span class="field">' + c.field + '</span> expected ' + c.expectedType + ', got ' + c.actualType + ' — ' + time + '</div>';
    });
    box.innerHTML = html;
  } catch(e){
    const box = document.getElementById('breaking-' + sourceName);
    if(box) box.innerHTML = '<h4>Breaking Changes</h4><span class="breaking-none">Could not load.</span>';
  }
}
</script>
</body>
</html>
