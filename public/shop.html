<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F7F8FA;color:#0F172A;}
header{background:#0A1A3D;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
header .logo{font-weight:700;font-size:18px;}
header .logo span{color:#4FC3F7;}
header .icons{display:flex;gap:16px;align-items:center;}
header a{color:#7FA3D9;text-decoration:none;font-size:13px;}
.cart-count{background:#4FC3F7;color:#001018;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;}
.hero{padding:40px 20px;text-align:center;background:linear-gradient(180deg,#0A1A3D,#0F172A);color:#fff;}
.hero h1{font-size:26px;margin-bottom:8px;}
.hero p{color:#93ACD6;font-size:14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px;}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);text-decoration:none;color:inherit;}
.card img{width:100%;height:130px;object-fit:cover;display:block;background:#E8ECF3;}
.card .info{padding:10px;}
.card h3{font-size:13px;margin-bottom:4px;}
.card .price{font-weight:700;font-size:14px;color:#0A1A3D;}
footer{text-align:center;padding:20px;font-size:12px;color:#888;}
</style>
</head>
<body>
<header>
  <div class="logo">NOVA<span>STORE</span></div>
  <div class="icons">
    <a href="shop-cart.html">Cart <span class="cart-count" id="cart-count">0</span></a>
    <a href="/shop-admin.html">Admin →</a>
  </div>
</header>

<div class="hero">
  <h1>Everyday essentials, delivered fast</h1>
  <p>A demo storefront showing Driftless working behind the scenes</p>
</div>

<div class="grid" id="product-grid"></div>

<footer>Demo store — no real payments. Powered by <a href="/" style="color:#4FC3F7;">Driftless</a>.</footer>

<script>
const products = [
  { id:1, name:'Wireless Headphones', price:49.99, color:'4FC3F7' },
  { id:2, name:'Smart Watch', price:89.99, color:'A855F7' },
  { id:3, name:'Running Shoes', price:64.50, color:'EC4899' },
  { id:4, name:'Backpack', price:34.00, color:'3B82F6' },
  { id:5, name:'Sunglasses', price:22.99, color:'FFD166' },
  { id:6, name:'Coffee Maker', price:75.00, color:'6EE7B7' }
];

function updateCartCount(){
  const cart = JSON.parse(localStorage.getItem('novaCart') || '[]');
  document.getElementById('cart-count').textContent = cart.length;
}

const grid = document.getElementById('product-grid');
products.forEach(p => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'shop-product.html?id=' + p.id;
  const imgUrl = 'https://placehold.co/300x260/' + p.color + '/ffffff?text=' + encodeURIComponent(p.name.replace(/ /g,'+'));
  a.innerHTML = '<img src="' + imgUrl + '" alt="' + p.name + '"><div class="info"><h3>' + p.name + '</h3><div class="price">$' + p.price.toFixed(2) + '</div></div>';
  grid.appendChild(a);
});

updateCartCount();
</script>
</body>
</html>
